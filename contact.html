
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Thamaga Lesego.">

    <title>Contact | THAMAGA-LESEGO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="contacts-page">

    <!-- Skip Link -->
    <a href="#main" class="skip-link">
        Skip to main content
    </a>

    <!-- Navigation Bar -->
    <nav class="navbar" aria-label="Main navigation">

        <span class="logo">LESEGO</span>

        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="contact.html" class="nav-link active"
                aria-current="page">Contact</a>
        </div>

<button type="button" id="themeToggle"
    class="theme-toggle" aria-pressed="false">
    Dark Mode
</button>

    </nav>

    <!-- Main Content -->
    <main id="main">

        <!-- Contact Header -->
        <header class="page-header contact-header">

            <h1>CONTACT ME</h1>

            <p>Feel free to get in touch with me.</p>

        </header>

        <!-- Contact Information -->
        <section class="contact-container">

            <h2>CONTACT INFORMATION</h2>

            <div class="contact-card">

                <h3>Phone Number</h3>

                <p>
                    <a href="tel:0717878349">0717878349</a>
                </p>

            </div>

            <div class="contact-card">

                <h3>Additional Contact</h3>

                <p>123 456 1234</p>

            </div>

            <!-- Contact Form -->
            <h2>SEND ME A MESSAGE</h2>

            <form id="contactForm">

                <!-- Full Name -->
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    minlength="2"
                    required
                >

                <!-- Email Address -->
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <!-- Topic -->
                <label for="topic">Topic</label>

                <select id="topic" name="topic" required>

                    <option value="">Select a topic</option>

                    <option value="General Inquiry">
                        General Inquiry
                    </option>

                    <option value="Project Discussion">
                        Project Discussion
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <!-- Message -->
                <label for="message">Your Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    placeholder="Write your message here..."
                    minlength="10"
                    required
                ></textarea>

                <!-- Character Counter -->
                <p id="charCount" aria-live="polite">
                    Characters: 0
                </p>

                <!-- Submit Button -->
                <button type="submit">
                    Send Message
                </button>

                <!-- Form Validation Message -->
                <p id="formMessage" role="status"></p>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Thamaga Lesego. All rights reserved.
        </p>

    </footer>

    <!-- JavaScript Connection -->
    <script src="script.js"></script>

</body>
</html>
